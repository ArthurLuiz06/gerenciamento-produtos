<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tituloPagina">Editar Produto</title>
    <link rel="stylesheet" href="./CSS/seu-estilo-adm.css">
</head>

 <header style="width: 100%; overflow: hidden;">
        <button id="btnSairConta">Sair da Conta</button>
    </header>

<body>

        <h2>Gerenciamento de Produtos</h2>

        <h3>Editar Produto: <span id="nomeProdutoEditando"></span></h3>

        <form id="formEdicaoProduto">

        <input type="hidden" id="idProduto" name="idProduto">

        <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" name="nome" required>

        <label for="descricao">Descrição:</label>
                <textarea id="descricao" name="descricao"></textarea>

        <label for="valor">Valor (R$):</label>
                <input type="number" id="valor" name="valor" step="0.01" required>

        <label for="quantidade">Estoque (Quantidade):</label>
                <input type="number" id="quantidade" name="quantidade" required>

        <label for="imagem_url">URL da Imagem:</label>
                <input type="url" id="imagem_url" name="imagem_url">

                <button type="submit">Salvar Alterações</button>
           
    </form>

        <p id="mensagemStatus" style="margin-top: 15px;"></p>
    <br>
    <a href="listar-produtos-adm.html">Voltar para a Listagem</a>

       
    <script src="./JS/produto-edicao.js"></script>
    <script src="./JS/logout-geral.js"></script>

</body>

</html>
