<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADM - Gerenciar Produtos</title>
</head>
<body>

    <h2>Cadastro de Novo Produto</h2>
    
    <form id="formCadastroProduto">
        <label for="nome">Nome do Produto:</label>
        <input type="text" id="nome" required><br><br>

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" rows="3"></textarea><br><br>

        <label for="valor">Valor (R$):</label>
        <input type="number" id="valor" step="0.01" required><br><br>

        <label for="estoque">Estoque Inicial:</label>
        <input type="number" id="estoque" required><br><br>

        <label for="imagem_url">URL da Imagem:</label>
        <input type="url" id="imagem_url" placeholder="Ex: http://imagem.com/produto.jpg"><br><br>

        <button type="submit">Cadastrar Produto</button>
        <p id="mensagemStatus"></p>
    </form>

    <script src="./JS/admin-produtos.js"></script>
</body>
</html>
